<!--

  render.js uni kadrma-kadr window.render(t) bilan chizadi va MP4 ga yozadi.

<style>
  :root {
    --bg: #F3F7F5; --surface: #FFFFFF; --surface-2: #E6EFEB;
    --ink: #14302E; --ink-2: #4B625F; --ink-3: #6F8581; --line: #CEDCD6;
    --teal: #1F7A6D; --teal-soft: #D8EEE9;
    --accent: #E39B12; --accent-ink: #8F5B00; --accent-soft: #FCEFD2;
    --ok: #2C8753; --ok-soft: #DDF1E4; --warn: #B96E00; --warn-soft: #FBEBCB;
    --bad: #C0402B; --bad-soft: #F8DEDA; --tg: #2F6DAA; --tg-soft: #DDEAF6;
    --font: "DejaVu Sans", "Liberation Sans", Arial, sans-serif;
    --mono: "DejaVu Sans Mono", "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font); }
  .scene { position: absolute; inset: 0; padding: 110px 150px 230px; opacity: 0; display: flex; flex-direction: column; gap: 34px; }
  .eyebrow { font-size: 26px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--teal); }
  h1 { margin: 0; font-size: 148px; line-height: 1; letter-spacing: -.02em; }
  h2 { margin: 0; font-size: 70px; line-height: 1.08; letter-spacing: -.01em; max-width: 1500px; }
  .mono { font-family: var(--mono); }
  [data-in] { opacity: 0; }

  /* subtitles */
  #sub { position: absolute; left: 0; right: 0; bottom: 64px; display: flex; justify-content: center; pointer-events: none; }
  #sub span { max-width: 1560px; text-align: center; font-size: 42px; line-height: 1.32; color: #fff; background: rgba(12, 28, 27, .86); padding: 14px 30px 16px; border-radius: 14px; }
  #sub span:empty { display: none; }

  /* progress bar */
  #bar { position: absolute; left: 0; bottom: 0; height: 8px; background: var(--accent); }

  /* S1 title */
  .s1 { justify-content: center; }
  .s1 .tagline { font-size: 54px; color: var(--ink-2); max-width: 1400px; line-height: 1.2; }
  .s1 .logo { display: flex; align-items: center; gap: 40px; }
  .s1 .term { width: 150px; height: 230px; border: 9px solid var(--teal); border-radius: 26px; position: relative; flex: none; }
  .s1 .term::before { content: ""; position: absolute; left: 36px; top: 34px; width: 60px; height: 60px; border-radius: 50%; border: 9px solid var(--teal); }
  .s1 .term::after { content: ""; position: absolute; left: 26px; top: 120px; width: 80px; height: 40px; border: 9px solid var(--teal); border-bottom: 0; border-radius: 60px 60px 0 0; }

  /* cards */
  .cards { display: grid; gap: 28px; }
  .card { background: var(--surface); border: 2px solid var(--line); border-radius: 26px; padding: 34px 38px; font-size: 38px; line-height: 1.3; display: flex; gap: 26px; align-items: flex-start; }
  .card .ico { width: 64px; height: 64px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 34px; font-weight: 700; color: #fff; }
  .p .card .ico { background: var(--bad); }
  .sec .card .ico { background: var(--teal); }

  /* diagram */
  .diagram { flex: 1; position: relative; }
  .diagram svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .node rect { fill: var(--surface); stroke: var(--line); stroke-width: 3; }
  .node.on rect { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 5; }
  .node .t { font: 700 40px var(--font); fill: var(--ink); }
  .node .s { font: 26px var(--font); fill: var(--ink-2); }
  .edge { fill: none; stroke: var(--teal); stroke-width: 5; }
  .zone { fill: var(--surface-2); }
  .zl { font: 700 22px var(--font); letter-spacing: .12em; fill: var(--ink-3); }
  .note { font: 700 30px var(--font); fill: var(--teal); }

  /* day */
  .day { display: grid; grid-template-columns: 420px 1fr; gap: 60px; flex: 1; align-items: start; }
  .clock { background: var(--ink); color: var(--bg); border-radius: 30px; padding: 40px 0; text-align: center; font: 700 120px var(--mono); }
  .events { display: grid; gap: 14px; }
  .ev { display: grid; grid-template-columns: 150px 220px 1fr; gap: 24px; align-items: center; background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 13px 26px; font-size: 30px; line-height: 1.25; }
  .ev .tm { font: 700 36px var(--mono); }
  .tag { display: inline-block; font-size: 26px; font-weight: 700; padding: 6px 18px; border-radius: 999px; text-align: center; }
  .tag.ok { background: var(--ok-soft); color: var(--ok); }
  .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .tag.tg { background: var(--tg-soft); color: var(--tg); }
  .tag.bad { background: var(--bad-soft); color: var(--bad); }
  .tag.acc { background: var(--accent-soft); color: var(--accent-ink); }

  /* timesheet */
  .tswrap { display: grid; grid-template-columns: 1fr 420px; gap: 40px; align-items: start; }
  table.ts { border-collapse: separate; border-spacing: 6px; background: var(--surface); border: 2px solid var(--line); border-radius: 24px; padding: 14px; font-size: 26px; }
  table.ts th { color: var(--ink-3); font-weight: 700; padding: 4px 6px; }
  table.ts td { text-align: center; padding: 10px 8px; border-radius: 8px; font-family: var(--mono); min-width: 86px; }
  table.ts td.nm { text-align: left; font-family: var(--font); font-weight: 700; min-width: 240px; }
  td.c { background: var(--surface-2); }
  td.late { background: var(--warn-soft); color: var(--warn); }
  td.abs { background: var(--bad-soft); color: var(--bad); font-weight: 700; }
  td.off { color: var(--ink-3); }
  td.fix { box-shadow: inset 0 0 0 4px var(--accent); }
  .legend { display: grid; gap: 18px; font-size: 30px; }
  .xl { margin-top: 18px; background: var(--ok); color: #fff; font-weight: 700; font-size: 32px; border-radius: 18px; padding: 22px 26px; text-align: center; }

  /* segments */
  .segs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
  .seg { background: var(--surface); border: 2px solid var(--line); border-radius: 24px; padding: 28px; display: grid; gap: 14px; }
  .seg b { font-size: 34px; }
  .seg .dot { width: 26px; height: 26px; border-radius: 50%; }
  .seg .pr { font-size: 28px; color: var(--ink-2); }
  .seg .pr .mono { color: var(--ink); font-weight: 700; }

  /* pilot / cta */
  .pilot .cards { grid-template-columns: repeat(3, 1fr); }
  .pilot .card { flex-direction: column; font-size: 36px; }
  .pilot .card .big { font-size: 64px; font-weight: 700; color: var(--teal); }
  .cta { justify-content: center; align-items: flex-start; }
  .cta .line { font-size: 54px; display: flex; gap: 26px; align-items: center; }
  .cta .line b { font-family: var(--mono); background: var(--surface); border: 3px solid var(--line); padding: 16px 28px; border-radius: 18px; }
</style>
</head>

var SEG = [
  ["#E39B12", "390 000"], ["#3A6FD8", "490 000"], ["#8A5CD6", "290 000"], ["#D2485E", "590 000"],
  ["#2F8FB0", "690 000"], ["#C8641E", "690 000"], ["#3E9B4F", "690 000"]
];

/* timesheet: 5 people x 10 working-or-not days. "!" late, "*" corrected */
var TS = [
  ["8:12", "8:05", "8:20", "8:02", "8:10", "D", "D", "8:07", "8:15", "7:58"],
  ["7:43!", "8:01", "8:00*", "8:09", "7:52!", "D", "D", "8:03", "8:06", "8:00"],
  ["8:30", "8:25", "8:31", "8:28", "8:12!", "D", "D", "8:33", "8:29", "8:27"],
  ["8:00", "8:03", "7:55", "K", "K", "D", "D", "8:01", "8:04", "7:59"],
  ["8:04", "7:58", "8:02", "8:05", "8:00", "D", "D", "7:47!", "8:03", "8:01"]
];

var lang = (new URLSearchParams(location.search).get("lang") || "uz");
var L = TEXT[lang];

document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = L[el.getAttribute("data-t")]; });

(function buildTs() {
  var h = "<tr><th></th>";
  for (var d = 0; d < 10; d++) h += "<th>" + (7 + d) + "<br>" + L.wd[d] + "</th>";
  h += "</tr>";
  TS.forEach(function (row, r) {
    h += '<tr><td class="nm">' + L.names[r] + "</td>";
    row.forEach(function (v, c) {
      var cls = "c", txt = v;
      if (v === "D") cls = "off";
      else if (v === "K") cls = "abs";
      else if (v.slice(-1) === "!") { cls = "c late"; txt = v.slice(0, -1); }
      else if (v.slice(-1) === "*") cls = "c fix";
      h += '<td class="' + cls + '" data-cell="' + (r * 10 + c) + '">' + txt + "</td>";
    });
    h += "</tr>";
  });
  document.getElementById("ts").innerHTML = h;
})();

(function buildSegs() {
  var h = "";
  SEG.forEach(function (s, i) {
    h += '<div class="seg" data-in="' + (0.9 + i * 0.55).toFixed(2) + '"><span class="dot" style="background:' + s[0] + '"></span><b>' + L.segs[i] + '</b><span class="pr">' + L.price(s[1]) + "</span></div>";
  });
  document.getElementById("segs").innerHTML = h;
})();

var scenes = Array.prototype.slice.call(document.querySelectorAll(".scene"));
var route = document.getElementById("route");
var routeLen = route.getTotalLength();
var pulse = document.getElementById("pulse");
var sub = document.querySelector("#sub span");

function clamp(x) { return Math.max(0, Math.min(1, x)); }
function ease(x) { x = clamp(x); return x * x * (3 - 2 * x); }

/* clock keyframes for the day scene: [local seconds, minutes since midnight] */
var CLOCK = [[0.5, 450], [2.0, 474], [5.5, 497], [8.0, 540], [10.5, 612], [13.4, 1026], [15.5, 1050]];
function clockAt(lt) {
  if (lt <= CLOCK[0][0]) return CLOCK[0][1];
  for (var i = 1; i < CLOCK.length; i++) {
    if (lt <= CLOCK[i][0]) {
      var a = CLOCK[i - 1], b = CLOCK[i], k = ease((lt - a[0]) / (b[0] - a[0]));
      return a[1] + (b[1] - a[1]) * k;
    }
  }
  return CLOCK[CLOCK.length - 1][1];
}
function hhmm(m) { m = Math.round(m); var h = Math.floor(m / 60); return (h < 10 ? "0" : "") + h + ":" + String(m % 60).padStart(2, "0"); }

window.render = function (t) {
  scenes.forEach(function (s) {
    var a = +s.dataset.start, b = +s.dataset.end, lt = t - a;
    var o = Math.min(ease(lt / 0.5), ease((b - t) / 0.5));
    s.style.opacity = (t >= a && t <= b) ? o : 0;
    s.querySelectorAll("[data-in]").forEach(function (el) {
      var k = ease((lt - +el.dataset.in) / 0.5);
      el.style.opacity = k;
      el.style.transform = "translateY(" + ((1 - k) * 28).toFixed(1) + "px)";
    });
    if (t < a || t > b) return;

    if (s.classList.contains("how")) {
      var k = ease((lt - 2.0) / 9.0), pt = route.getPointAtLength(routeLen * k);
      pulse.setAttribute("cx", pt.x); pulse.setAttribute("cy", pt.y);
      pulse.style.opacity = (lt > 1.6 && lt < 12) ? 1 : 0;
      document.getElementById("n-term").classList.toggle("on", lt > 1.6 && lt < 4.2);
      document.getElementById("n-agent").classList.toggle("on", k > 0.18 && k < 0.5);
      document.getElementById("n-cloud").classList.toggle("on", k > 0.55 && k < 0.85);
      document.getElementById("n-tg").classList.toggle("on", k > 0.95);
      document.getElementById("n-xl").classList.toggle("on", k > 0.95);
    }
    if (s.classList.contains("dayS")) {
      document.getElementById("clock").textContent = hhmm(clockAt(lt));
    }
    if (s.classList.contains("tsS")) {
      document.querySelectorAll("[data-cell]").forEach(function (td) {
        var i = +td.dataset.cell, at = 0.9 + (i % 10) * 0.12 + Math.floor(i / 10) * 0.18;
        td.style.opacity = ease((lt - at) / 0.3);
      });
      var xl = document.getElementById("xl"), press = lt > 6.8 && lt < 7.3;
      xl.style.transform += press ? " scale(0.94)" : "";
      xl.style.filter = lt > 6.8 ? "brightness(1.12)" : "";
    }
  });

  var text = "";
  CUES[lang].forEach(function (c) { if (t >= c[0] && t < c[1]) text = c[2]; });
  if (sub.textContent !== text) sub.textContent = text;
  document.getElementById("bar").style.width = (100 * t / DURATION).toFixed(3) + "%";
};

window.DURATION = DURATION;
window.CUES = CUES;
render(0);
</script>
