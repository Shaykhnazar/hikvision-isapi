<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Onest:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root {
    --bg: #F3F7F5;
    --surface: #FFFFFF;
    --surface-2: #E6EFEB;
    --ink: #14302E;
    --ink-2: #4B625F;
    --ink-3: #6F8581;
    --line: #CEDCD6;
    --accent: #E39B12;
    --accent-ink: #8F5B00;
    --accent-soft: #FCEFD2;
    --teal: #1F7A6D;
    --teal-soft: #D8EEE9;
    --ok: #2C8753;
    --ok-soft: #DDF1E4;
    --warn: #B96E00;
    --warn-soft: #FBEBCB;
    --bad: #C0402B;
    --bad-soft: #F8DEDA;
    --tg: #2F6DAA;
    --tg-soft: #DDEAF6;
    --shadow: 0 1px 2px rgba(20,48,46,.06), 0 6px 20px rgba(20,48,46,.06);
    --display: "Fredoka", "Nunito", "Trebuchet MS", system-ui, sans-serif;
    --body: "Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0E1B1A;
      --surface: #142523;
      --surface-2: #1B302D;
      --ink: #E4EFEB;
      --ink-2: #A6BAB5;
      --ink-3: #82978F;
      --line: #2A4440;
      --accent: #F2B23A;
      --accent-ink: #F2B23A;
      --accent-soft: #3A2E14;
      --teal: #4EC3AE;
      --teal-soft: #173A35;
      --ok: #62CB8E;
      --ok-soft: #173826;
      --warn: #F1AA3C;
      --warn-soft: #3A2B12;
      --bad: #F17D69;
      --bad-soft: #3E1F1A;
      --tg: #82B3E8;
      --tg-soft: #1A2D42;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0E1B1A;
    --surface: #142523;
    --surface-2: #1B302D;
    --ink: #E4EFEB;
    --ink-2: #A6BAB5;
    --ink-3: #82978F;
    --line: #2A4440;
    --accent: #F2B23A;
    --accent-ink: #F2B23A;
    --accent-soft: #3A2E14;
    --teal: #4EC3AE;
    --teal-soft: #173A35;
    --ok: #62CB8E;
    --ok-soft: #173826;
    --warn: #F1AA3C;
    --warn-soft: #3A2B12;
    --bad: #F17D69;
    --bad-soft: #3E1F1A;
    --tg: #82B3E8;
    --tg-soft: #1A2D42;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.6;
    padding-inline: 16px;
  }
  .wrap { max-width: 1080px; margin-inline: auto; }
  h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.15; text-wrap: balance; margin: 0; }
  h1 { font-size: clamp(2.1rem, 5.2vw, 3.5rem); letter-spacing: -.01em; }
  h2 { font-size: clamp(1.6rem, 3.4vw, 2.3rem); }
  h3 { font-size: 1.2rem; }
  p { margin: 0; }
  .muted { color: var(--ink-2); }
  .eyebrow {
    font-size: .78rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
    color: var(--teal);
  }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  a { color: var(--teal); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  /* nav */
  .topnav {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    margin-inline: -16px; padding-inline: 16px;
  }
  .topnav ul {
    list-style: none; margin: 0 auto; padding: 10px 0; max-width: 1080px;
    display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
  }
  .topnav ul::-webkit-scrollbar { display: none; }
  .topnav a {
    display: block; white-space: nowrap; text-decoration: none; color: var(--ink-2);
    font-size: .88rem; font-weight: 500; padding: 5px 11px; border-radius: 999px;
  }
  .topnav a:hover { background: var(--surface-2); color: var(--ink); }

  section { padding-block: 64px 8px; scroll-margin-top: 60px; }
  .sec-head { display: grid; gap: 10px; max-width: 700px; margin-bottom: 28px; }
  .sec-head p { color: var(--ink-2); font-size: 1.05rem; }

  /* hero */
  .hero { padding-block: 56px 16px; display: grid; gap: 28px; }
  .hero-text { display: grid; gap: 18px; max-width: 760px; }
  .hero-text .lead { font-size: 1.15rem; color: var(--ink-2); max-width: 62ch; }
  .hero h1 em { font-style: normal; color: var(--accent-ink); }
  .chain { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .chain .step {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 10px 14px; font-weight: 500;
  }
  .chain .step b { font-family: var(--mono); font-weight: 500; font-size: .85rem; color: var(--teal); }
  .chain .arrow { color: var(--ink-3); font-size: 1.2rem; }
  .who { display: flex; flex-wrap: wrap; gap: 8px; }
  .who span {
    font-size: .85rem; padding: 4px 10px; border-radius: 999px;
    background: var(--teal-soft); color: var(--ink);
  }

  /* diagram */
  .diagram-box {
    background: var(--surface); border: 1px solid var(--line); border-radius: 22px;
    box-shadow: var(--shadow); padding: 16px;
  }
  .diagram-scroll { overflow-x: auto; }
  .diagram-scroll svg { display: block; width: 100%; min-width: 760px; height: auto; }
  svg text { font-family: var(--body); fill: var(--ink); }
  svg .t-title { font-family: var(--display); font-weight: 600; font-size: 19px; }
  svg .t-sub { font-size: 13px; fill: var(--ink-2); }
  svg .t-zone { font-size: 11.5px; font-weight: 600; letter-spacing: .12em; fill: var(--ink-3); }
  svg .t-edge { font-size: 12.5px; fill: var(--ink-2); }
  svg .zone { fill: var(--surface-2); }
  svg .node rect.box { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; transition: stroke .2s, fill .2s; }
  svg .node { cursor: pointer; }
  svg .node:hover rect.box, svg .node.is-active rect.box { stroke: var(--accent); stroke-width: 2.5; }
  svg .node.is-active rect.box { fill: var(--accent-soft); }
  svg .ico { fill: none; stroke: var(--teal); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  svg .ico-fill { fill: var(--teal); }
  svg .edge { fill: none; stroke: var(--teal); stroke-width: 2; }
  svg .edge-dash { fill: none; stroke: var(--ink-3); stroke-width: 1.5; stroke-dasharray: 5 5; }
  svg .arrowhead { fill: var(--teal); }
  svg .pulse { fill: var(--accent); }
  .diagram-hint { font-size: .85rem; color: var(--ink-3); margin: 8px 4px 0; }

  .node-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 18px; }
  .node-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px 18px; display: grid; gap: 6px; align-content: start;
    transition: border-color .2s, background .2s;
  }
  .node-card.is-active { border-color: var(--accent); background: var(--accent-soft); }
  .node-card .where { font-size: .76rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
  .node-card p { color: var(--ink-2); font-size: .95rem; }

  /* timeline */
  .timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; position: relative; }
  .timeline li { display: grid; grid-template-columns: 92px 28px 1fr; gap: 0 14px; }
  .timeline .time { font-family: var(--mono); font-size: 1rem; padding-top: 14px; text-align: right; color: var(--ink); }
  .timeline .rail { position: relative; }
  .timeline .rail::before { content: ""; position: absolute; left: 13px; top: 0; bottom: 0; width: 2px; background: var(--line); }
  .timeline li:first-child .rail::before { top: 20px; }
  .timeline li:last-child .rail::before { bottom: calc(100% - 20px); }
  .timeline .dot { position: absolute; left: 6px; top: 16px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); border: 3px solid var(--teal); }
  .timeline .dot.warn { border-color: var(--warn); }
  .timeline .dot.bad { border-color: var(--bad); }
  .timeline .dot.ok { border-color: var(--ok); }
  .timeline .dot.acc { border-color: var(--accent); background: var(--accent); }
  .timeline .body { padding: 10px 0 22px; display: grid; gap: 4px; }
  .timeline .body h3 { font-size: 1.08rem; }
  .timeline .body p { color: var(--ink-2); max-width: 64ch; }
  .tag {
    display: inline-flex; align-items: center; gap: 6px; width: fit-content;
    font-size: .78rem; font-weight: 600; padding: 2px 9px; border-radius: 999px;
    background: var(--teal-soft); color: var(--teal);
  }
  .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .tag.bad { background: var(--bad-soft); color: var(--bad); }
  .tag.ok { background: var(--ok-soft); color: var(--ok); }
  .tag.tg { background: var(--tg-soft); color: var(--tg); }
  .tag.acc { background: var(--accent-soft); color: var(--accent-ink); }

  /* enrol flow */
  .flow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; counter-reset: fl; }
  .flow > div {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px; display: grid; gap: 6px; align-content: start; position: relative;
  }
  .flow > div::before {
    counter-increment: fl; content: counter(fl);
    font-family: var(--display); font-weight: 600; font-size: .95rem;
    width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
    background: var(--teal); color: var(--surface);
  }
  .flow h3 { font-size: 1rem; }
  .flow p { font-size: .9rem; color: var(--ink-2); }
  .flow .where { font-size: .74rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }

  .two { display: grid; grid-template-columns: 1.25fr 1fr; gap: 18px; margin-top: 22px; align-items: start; }
  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    padding: 18px; box-shadow: var(--shadow);
  }
  .panel-title { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .panel-title h3 { font-size: 1.05rem; }
  .panel-title small { color: var(--ink-3); font-size: .8rem; }
  .table-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .92rem; }
  th { text-align: left; font-weight: 600; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  .err { font-size: .85rem; color: var(--bad); margin-top: 4px; }
  .list-plain { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; }
  .list-plain li { display: grid; gap: 2px; }
  .list-plain b { font-weight: 600; }
  .list-plain span { color: var(--ink-2); font-size: .95rem; }

  /* timesheet */
  .ts-rules { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  .rule { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 4px; align-content: start; }
  .rule b { font-family: var(--display); font-weight: 600; font-size: 1.02rem; }
  .rule span { font-size: .9rem; color: var(--ink-2); }
  .ts table { font-size: .86rem; min-width: 900px; }
  .ts th, .ts td { padding: 7px 6px; text-align: center; }
  .ts th:first-child, .ts td:first-child { text-align: left; padding-left: 10px; white-space: nowrap; position: sticky; left: 0; background: var(--surface); z-index: 1; }
  .ts td.c { font-family: var(--mono); font-variant-numeric: tabular-nums; border-radius: 6px; }
  .ts td.late { background: var(--warn-soft); color: var(--warn); }
  .ts td.abs { background: var(--bad-soft); color: var(--bad); font-weight: 600; }
  .ts td.off { color: var(--ink-3); background: var(--surface-2); }
  .ts td.fix { box-shadow: inset 0 0 0 2px var(--accent); }
  .ts td.tot { font-family: var(--mono); font-weight: 500; background: var(--surface-2); }
  .ts th.we { color: var(--ink-3); }
  .ts .role { display: block; font-size: .75rem; color: var(--ink-3); }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; font-size: .86rem; color: var(--ink-2); }
  .legend i { display: inline-block; width: 22px; height: 16px; border-radius: 4px; vertical-align: -3px; margin-right: 6px; font-style: normal; font-family: var(--mono); font-size: .72rem; text-align: center; line-height: 16px; }
  .fixcard { display: grid; gap: 10px; }
  .fixrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-family: var(--mono); font-size: 1rem; }
  .fixrow .from { background: var(--bad-soft); color: var(--bad); padding: 2px 10px; border-radius: 6px; }
  .fixrow .to { background: var(--accent-soft); color: var(--accent-ink); padding: 2px 10px; border-radius: 6px; box-shadow: inset 0 0 0 2px var(--accent); }
  dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; font-size: .93rem; }
  dl.kv dt { color: var(--ink-3); }
  dl.kv dd { margin: 0; }

  /* telegram */
  .chats { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .chat { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); }
  .chat-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 600; background: var(--tg); color: var(--surface); flex: none; }
  .chat-head b { display: block; font-size: .98rem; }
  .chat-head small { color: var(--ink-3); font-size: .8rem; }
  .chat-body { padding: 16px; display: grid; gap: 12px; background: var(--surface-2); }
  .msg { background: var(--surface); border-radius: 4px 16px 16px 16px; padding: 12px 14px; max-width: 94%; font-size: .93rem; display: grid; gap: 6px; box-shadow: 0 1px 1px rgba(0,0,0,.05); }
  .msg .mt { font-weight: 600; }
  .msg .row { display: flex; justify-content: space-between; gap: 12px; }
  .msg .row span:last-child { font-family: var(--mono); }
  .msg .meta { font-size: .72rem; color: var(--ink-3); text-align: right; font-family: var(--mono); }
  .msg ul { margin: 0; padding-left: 18px; color: var(--ink-2); }
  .chat-note { padding: 12px 16px; font-size: .87rem; color: var(--ink-2); border-top: 1px solid var(--line); }

  /* reliability */
  .layers { display: grid; gap: 12px; }
  .layer { display: grid; grid-template-columns: 170px 1fr; gap: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; align-items: start; }
  .layer .when { font-family: var(--display); font-weight: 600; font-size: 1.15rem; color: var(--teal); }
  .layer .when small { display: block; font-family: var(--body); font-weight: 500; font-size: .8rem; color: var(--ink-3); letter-spacing: .02em; }
  .layer p { color: var(--ink-2); }
  .layer h3 { font-size: 1.05rem; margin-bottom: 4px; }
  .callout {
    margin-top: 16px; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center;
    background: var(--accent-soft); border-radius: 16px; padding: 16px 18px;
  }
  .callout .big { font-family: var(--display); font-weight: 600; font-size: 2rem; color: var(--accent-ink); line-height: 1; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 18px; }
  .fact { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 6px; align-content: start; }
  .fact h3 { font-size: 1.02rem; }
  .fact p { color: var(--ink-2); font-size: .93rem; }

  /* security */
  .sec-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .sec-item { display: grid; grid-template-columns: 44px 1fr; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .sec-item svg { width: 44px; height: 44px; }
  .sec-item h3 { font-size: 1.04rem; margin-bottom: 4px; }
  .sec-item p { color: var(--ink-2); font-size: .94rem; }
  .roles { margin-top: 18px; }
  .roles td:first-child { font-weight: 600; white-space: nowrap; }
  .yes { color: var(--ok); font-weight: 600; }
  .no { color: var(--ink-3); }

  /* limits */
  .limits { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .limit { border: 1.5px dashed var(--line); border-radius: 16px; padding: 16px 18px; display: grid; gap: 6px; background: var(--bg); }
  .limit h3 { font-size: 1.04rem; }
  .limit p { color: var(--ink-2); font-size: .94rem; }
  .limit.first { border-color: var(--accent); background: var(--accent-soft); }

  /* setup */
  .needs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 22px; }
  .need { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 4px; }
  .need b { font-family: var(--display); font-weight: 600; font-size: 1.05rem; }
  .need span { color: var(--ink-2); font-size: .93rem; }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 20px; counter-reset: st; }
  .steps li { display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: start; }
  .steps li::before {
    counter-increment: st; content: counter(st);
    width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center;
    font-family: var(--display); font-weight: 600; background: var(--accent-soft); color: var(--accent-ink);
  }
  .steps b { display: block; }
  .steps span { color: var(--ink-2); font-size: .93rem; }

  /* price */
  .price-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 18px; align-items: start; }
  .tariffs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 18px; }
  .tariff { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 2px; align-content: start; }
  .tariff.hl { border: 2px solid var(--accent); background: var(--accent-soft); }
  .t-name { font-family: var(--display); font-weight: 600; font-size: 1.2rem; }
  .t-for { color: var(--ink-2); font-size: .92rem; margin-bottom: 10px; }
  .t-price { font-size: 1.6rem; font-weight: 500; color: var(--ink); line-height: 1.2; }
  .tariff.hl .t-price { color: var(--accent-ink); }
  .t-unit { color: var(--ink-3); font-size: .85rem; }
  .calc { display: grid; gap: 12px; }
  .calc-label { font-weight: 500; }
  .calc input[type=range] { width: 100%; accent-color: var(--accent); }
  .calc-out dd { font-weight: 600; }
  .price td:last-child { font-family: var(--mono); text-align: right; white-space: nowrap; }
  .price tr.hl td { background: var(--accent-soft); }
  .price tr.hl td:first-child { border-radius: 8px 0 0 8px; }
  .price tr.hl td:last-child { border-radius: 0 8px 8px 0; }
  .honest { background: var(--ink); color: var(--bg); border-radius: 18px; padding: 20px; display: grid; gap: 12px; }
  .honest h3 { color: var(--bg); }
  .honest p, .honest li { color: color-mix(in srgb, var(--bg) 82%, var(--ink)); font-size: .95rem; }
  .honest ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
  .honest b { color: var(--bg); }

  /* faq */
  .faq { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .qa { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; display: grid; gap: 6px; align-content: start; }
  .qa h3 { font-size: 1.02rem; }
  .qa p { color: var(--ink-2); font-size: .94rem; }

  footer { margin-block: 64px 40px; padding-top: 28px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 18px; justify-content: space-between; align-items: center; }
  .contact { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
